name: publish

# Publishing is gated on the version in package.json actually changing, not on
# every push landing on main. npm refuses to republish an existing version, so
# an ungated "publish on push" would fail loudly on every doc fix and typo
# commit. The gate makes "bump the version and push" the entire release
# process: this workflow does the rest, including tagging.
on:
  push:
    branches: [main]

jobs:
  publish:
    if: github.repository == 'tabreu8/persona-council'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to push the release tag once published
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - run: node --test

      - name: Check whether this version is already on npm
        id: check
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view persona-council version 2>/dev/null || echo "none")
          echo "local=$LOCAL" >> "$GITHUB_OUTPUT"
          if [ "$LOCAL" = "$PUBLISHED" ]; then
            echo "Version $LOCAL is already published -- nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version $LOCAL is new (npm currently has: $PUBLISHED). Publishing."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # prepublishOnly (package.json) reruns the suite as a second gate right
      # before the registry write; the explicit run above just fails fast and
      # keeps the reason visible in its own log step.
      - name: Publish to npm
        if: steps.check.outputs.skip == 'false'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Tag the release
        if: steps.check.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.check.outputs.local }}"
          git push origin "v${{ steps.check.outputs.local }}"
